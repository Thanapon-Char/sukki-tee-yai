<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #f8fafc;
      }

      .card {
        text-align: center;
        padding: 2rem 3rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.45);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 3rem;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 1.1rem;
      }

      button {
        border: none;
        border-radius: 999px;
        background: #f59e0b;
        color: #111827;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.9rem 1.5rem;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Go!</h1>
      <p>Everything is ready. Let’s get moving.</p>
      <button onclick="alert('Let\'s go!')">Start</button>
    </div>
  </body>
</html>
